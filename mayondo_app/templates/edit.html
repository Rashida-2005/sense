{% comment %} {% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container mx-auto mt-8 max-w-lg p-6 bg-white shadow rounded-lg">
    <h2 class="text-2xl font-semibold mb-4">Edit {{ object_name }}</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="flex space-x-4 mt-4">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                Update
            </button>
            
            <a href="{{  }}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %} {% endcomment %}
