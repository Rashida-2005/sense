{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<form method="POST" action="{% url 'mayondo_app:dashboard' %}" class="login-form" novalidate>
{% csrf_token %}
<div class="login-wrapper">
  <div class="login-card">
    <h2>Welcome Back!</h2>
    <p>Please log in to continue.</p>
{{ form | crispy}}
{{ form.non_field_errors }}

 <div class="login-footer">
 <button type="submit" class="btn-login">Log In</button>
  <span>Don't have an account? Reach out to the manager</span>
</div>
</div>
{% endblock content %}
