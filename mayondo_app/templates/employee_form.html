{% comment %} {% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-6 mt-6">
  <h2 class="text-2xl font-bold mb-4">Add New Employee</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="flex justify-end space-x-2">
      <a href="{% url 'mayondo_app:employee_list' %}" 
         class="px-4 py-2 bg-gray-300 text-red-800 rounded hover:bg-red-400 transition">
        Cancel
      </a>
      <button type="submit" 
              class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600  transition">
        Add Employee
      </button>
    </div>
  </form>
</div>
{% endblock %} {% endcomment %}
