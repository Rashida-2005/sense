{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container mx-auto mt-12 max-w-lg p-6 bg-white shadow rounded-lg">
    <h2 class="text-2xl font-semibold text-red-600 mb-4">
        Delete {{ object_name }}
    </h2>

    <p class="text-gray-700 mb-6">
        Are you sure you want to delete <span class="font-bold">{{ object }}</span>? 
        This action cannot be undone.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="flex space-x-4">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Yes, Delete
            </button>
            <a href="{{ cancel_url }}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
